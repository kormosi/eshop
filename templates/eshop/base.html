  <link rel="stylesheet" href="{% static 'eshop/css/style.css' %}">

<body>

<header>
  <div class="header-container">
    <a href="{% url 'home' %}" class="logo">Silvia Kormosi</a>

    <a href="{% url 'cart' %}" id="cart-link" aria-label="Cart">
      <img src="{% static 'eshop/images/cart.svg' %}" alt="" class="cart-icon">

  </div>

  <!--    TODO pridať aj anglické verzie -->

    <nav id="sk-nav" class="lang active">

          <li><a href="{% url 'coming_soon' %}">Pripravujeme</a></li>
          <li><a href="{% url 'about' %}">O autorke</a></li>
      </ul>
    </nav>

    <nav id="en-nav" class="lang">
      <ul> 
      <li><a href="{% url 'home' %}">Store</a></li>

      <li><a href="{% url 'about' %}">About me</a></li>
      </ul>
      
    </nav>

<div class="container">

<script src="{% static 'eshop/js/lang.js' %}"></script>
<script src="{% static 'eshop/js/cart.js' %}"></script>

{% block scripts %}
{% endblock %}

</html>
