{% load static %}

<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>Silvia Kormosi</title>
  <meta name="author" content="">
  <meta name="description" content="">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="{% static 'eshop/css/style.css' %}">
</head>

<body>

<header>
  <div class="header-container">
    <a href="{% url 'home' %}" class="logo">Silvia Kormosi</a>
      
      <div class="lang-and-cart">
          
        <div class="lang-switch">
            <a id="sk" onclick="setLang('sk')">SK</a> |
            <a id="en" onclick="setLang('en')">EN</a>
        </div>
        
        <a href="{% url 'cart' %}" id="cart-link" aria-label="Cart">
          <img src="{% static 'eshop/images/cart.svg' %}" alt="" class="cart-icon">
          <span id="cart-count" class="cart-count" hidden>0</span>
        </a>
              
      </div>

  </div>
</header>

    <nav id="sk-nav" class="lang active">
      <ul>
          <li><a href="{% url 'home' %}" class="{% if request.resolver_match.url_name == 'home' %}active{% endif %}">E-shop</a></li>
          <li><a href="{% url 'coming_soon' %}" class="{% if request.resolver_match.url_name == 'coming_soon' %}active{% endif %}">Pripravujeme</a></li>
          <li><a href="{% url 'about' %}" class="{% if request.resolver_match.url_name == 'about' %}active{% endif %}">O autorke</a></li>
      </ul>
    </nav>

    <nav id="en-nav" class="lang">
      <ul>
      <li><a href="{% url 'home' %}" class="{% if request.resolver_match.url_name == 'home' %}active{% endif %}">Store</a></li>
      <li><a href="{% url 'coming_soon' %}" class="{% if request.resolver_match.url_name == 'coming_soon' %}active{% endif %}">Coming soon</a></li>
      <li><a href="{% url 'about' %}" class="{% if request.resolver_match.url_name == 'about' %}active{% endif %}">About me</a></li>
      </ul>

    </nav>

<div class="container">
{% block content %}
{% endblock content %}
</div>

<footer>
  <nav class="footer-links">
    <a href="{% url 'vop' %}">Všeobecné obchodné podmienky</a>
    <a href="{% url 'osobne_udaje' %}">Ochrana osobných údajov</a>
    <a href="{% url 'odstupenie' %}">Odstúpenie od zmluvy</a>
  </nav>
</footer>

<script src="{% static 'eshop/js/lang.js' %}"></script>
<script src="{% static 'eshop/js/cart.js' %}"></script>

{% block scripts %}
{% endblock %}

</body>

</html>
