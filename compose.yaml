x-defaults: &defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  web:
    <<: *defaults
    build: .
    env_file: .env
    environment:
      DB_PATH: /data/db.sqlite3
      MEDIA_ROOT: /data/media
    volumes:
      - data:/data
      - static:/app/staticfiles
    # No published ports: reachable only through caddy.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  caddy:
    <<: *defaults
    image: caddy:2-alpine
    depends_on:
      - web
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - static:/srv/static:ro
      - caddy_data:/data
      - caddy_config:/config
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true

volumes:
  data:
  static:
  caddy_data:
  caddy_config:
